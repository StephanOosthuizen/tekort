<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekort</title>
<style>
  :root { --ink: #16160f; --quiet: #5c5c52; --paper: #faf9f5; --mark: #00A85C; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #f2f0ea; --quiet: #9a9a92; --paper: #0e0e0c; --mark: #00E17A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
         display: flex; align-items: center; justify-content: center;
         font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 520px; padding: 48px 16px; }
  h1 { font-size: 40px; margin: 0 0 12px; letter-spacing: -0.03em; }
  p { color: var(--quiet); margin: 0 0 28px; }
  nav a { color: var(--mark); margin-right: 20px; }
</style>
</head>
<body>
<main>
  <h1>Tekort</h1>
  <p>How many calories you can eat today, and what to eat to hit it.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </nav>
</main>
</body>
</html>
